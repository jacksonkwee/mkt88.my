services:
  - type: web
    name: mkt88-4d
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start-render
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
