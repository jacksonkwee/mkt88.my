name: Capture live results

# The operator's Singapore live stream reveals the draw number by number and
# then clears itself. This stores whatever it has shown, so the app keeps the
# live result on screen instead of falling back to the previous draw.
#
# Free: this repository is public, so GitHub does not charge for these runs.
on:
  schedule:
    - cron: "*/5 7-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture the live feed
        run: node scripts/capture-sg-live.mjs

      - name: Publish the capture
        run: |
          git config user.name  "mkt88-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/sg-live.json
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "Live capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push