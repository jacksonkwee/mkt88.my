# GitLab CI for mkt88.my
#
# ONE job only: the daily number-history refresh. It used to run on GitHub
# Actions, which stopped dead when that account was suspended - and that is why
# the archive froze at 2026-09-29.
#
# Why only the daily job: GitLab's free tier gives 400 compute minutes a month.
# A once-a-day job taking 2-3 minutes uses roughly 60-90 of those, which fits
# comfortably. The jobs that run every 5-15 minutes would burn the whole quota in
# a single day, so those stay on the PC (or wait for GitHub to come back).
#
# One-time setup in GitLab:
#   1. Settings -> CI/CD -> Job token permissions
#      turn ON "Allow Git push requests to the repository"
#   2. CI/CD -> Schedules -> New schedule
#        Description      : daily number history
#        Interval pattern : 30 16 * * *
#        Target branch    : main
#        Timezone         : UTC   (16:30 UTC = 00:30 Malaysia, after the last draw)
#
# This never runs on an ordinary push - only on a schedule or when started by
# hand from the GitLab web UI.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

live-pages:
  image: node:20
  timeout: 12m
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/check-live-pages.mjs --expect-commit "$CI_COMMIT_SHA"

alert-test:
  image: node:20
  timeout: 3m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - node scripts/check-live-pages.mjs --test-alert

number-history:
  image: node:20
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - node scripts/check-card-contracts.mjs
    - node scripts/refresh-number-history.mjs
    # Lucky HariHari and Grand Dragon/Nine Lotto past draws live in bundled
    # copies that only the PC's daily task used to extend - it stopped on
    # 28-09-2026, which left the hot-numbers page showing HariHari only up to
    # 09-10-2026 (reported 12 Oct 2026). They are refreshed here too now.
    # Inspect the full recent window. Complete dates are skipped, so this is
    # cheap; partial or missing GD/Nine records are retried every day.
    - RECONCILE_FAILED=0
    - node scripts/build-gd-nine-past.mjs --days 30 || RECONCILE_FAILED=1
    - node scripts/check-past-results.mjs
    - node scripts/build-hari-past.mjs --days 3
    - node scripts/build-number-stats.mjs
    - git config user.name "mkt88-results-bot"
    - git config user.email "ci@mkt88.my"
    # The project folders were renamed on 16 Oct 2026. This line still named the
    # old one, so `git add` failed and every scheduled run died before pushing -
    # which is the other half of why the hot numbers went stale.
    - git add -- src/components/sites/mkt88/app/number-history-db.json src/lib/number-stats.json src/lib/gd-nine-past.json src/lib/hari-past.json
    - |
      if git diff --cached --quiet; then
        echo "nothing new today"
      else
        git commit -m "Number history updated $(date -u '+%Y-%m-%d %H:%M UTC')"
        # Two ways to push: the job token (needs "Allow Git push requests" in
        # the CI/CD settings) or a Project Access Token kept in GIT_PUSH_TOKEN.
        if [ -n "$GIT_PUSH_TOKEN" ]; then
          git push "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
        else
          git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
        fi
      fi
    # Still save every repair that succeeded, then fail the job so the owner is
    # notified about dates that no source could complete.
    - |
      if [ "$RECONCILE_FAILED" -ne 0 ]; then
        echo "Recent past-result reconciliation is incomplete"
        exit 1
      fi
